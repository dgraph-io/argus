# Run argus as an in-cluster Job against a Dgraph cluster in the same namespace.
#
# Running in-cluster is required for correct multi-alpha metrics: argus discovers
# every alpha from the seed's /state and reaches each pod directly (per-pod DNS /
# pod IP), which only resolves inside the cluster. Pointing argus at an external
# LoadBalancer VIP instead would scramble per-node scraping (each request hits a
# random alpha).
#
# Before applying, replace REPLACE_* and confirm the namespace and the alpha
# Service name match your Helm release (default release "dgraph" => Service
# "dgraph-dgraph-alpha").
apiVersion: batch/v1
kind: Job
metadata:
  name: argus
  namespace: default
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600 # keep the pod ~1h so results can be copied out
  template:
    metadata:
      labels:
        app: argus
    spec:
      restartPolicy: Never
      # Schedule the load generator off the Dgraph nodes so it does not steal CPU
      # from the system under test. Uncomment and set to your argus node pool:
      # nodeSelector:
      #   cloud.google.com/gke-nodepool: argus-pool
      containers:
        - name: argus
          image: REPLACE_WITH_IMAGE # e.g. us-docker.pkg.dev/PROJECT/REPO/argus:v1
          args:
            - -cluster=$(DGRAPH_ALPHA):9080 # seed gRPC (DQL)
            - -graphql=http://$(DGRAPH_ALPHA):8080 # seed HTTP (GraphQL); /state discovery finds the rest
            - -duration=30m
            - -label=REPLACE_LABELS # e.g. machine=e2-standard-4,nodes=3,config=sharded,region=us-central1
            - -dgraph-branch=REPLACE_BRANCH # from `dgraph version`
            - -ops-output=/out/argus-ops.csv
            - -runtime-output=/out/argus-runtime.csv
            - -cluster-output=/out/argus-cluster.csv
          env:
            - name: DGRAPH_ALPHA
              value: dgraph-dgraph-alpha # alpha Service; used only as the discovery seed
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 4Gi
          volumeMounts:
            - name: out
              mountPath: /out
      volumes:
        - name: out
          emptyDir: {}
